<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rapids' Contact Us</title>
    <meta name="description" content="Contact Us page for The Rapids, including contact information and a contact form">
    <meta name="author" content="Jericho Angolluan">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/the-rapids-logo.png" alt="The Rapids Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="contactinfo">
            <h1>The Rapids</h1>
            <div class="infos">
                <p>138 Matalino Street</p>
                <p>Antipolo City, Rizal, Philippines</p>
                <p>09776672617</p>
                <p>info@therafting.com</p>
            </div>
        </div>

        <div class="map">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3861.3613342410927!2d121.17757619142192!3d14.57847488931705!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397c0a8f8e55959%3A0xa12fb1d59f28519!2sSitio%20Tubigan%2C%20Antipolo%2C%201870%20Rizal!5e0!3m2!1sen!2sph!4v1764387696908!5m2!1sen!2sph"
                allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            <form>
                <div class="firstrow">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Placeholder" required>
                </div>
                <div class="firstrow">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" placeholder="Placeholder" required>
                </div>
                <div class="firstrow">
                    <label>Message Purpose</label>
                    <div>
                        <div>
                            <input type="radio" id="GI" name="Purpose" value="1" checked>
                            <label for="GI">General Inquiry</label>
                        </div>
                        <div>
                            <input type="radio" id="RQ" name="Purpose" value="2">
                            <label for="RQ">Reservation Question</label>
                        </div>
                        <div>
                            <input type="radio" id="WS" name="Purpose" value="3">
                            <label for="WS">Website Suggestion</label>
                        </div>
                    </div>
                </div>
                <!-- <div class="message"> -->
                <label for="message">Message</label>
                <textarea name="message" id="message" rows="3" placeholder="Type here"></textarea>
                <!-- </div> -->
                <div class="check">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section>
            <div class="employee">
                <div class="serve">
                    <h2>We Are Here to Serve You</h2>
                </div>
                <div class="photo">
                    <figure>
                        <img src="images/maria-ria-santos.jpg" alt="Maria “Ria” Santos' Photo">
                        <figcaption>Maria “Ria” Santos <br>
                            <span>Lead River Guide</span>
                        </figcaption>
                    </figure>
                </div>
                <div class="photo">
                    <figure>
                        <img src="images/jacob-ramirez.jpg" alt="Jacob Ramirez' Photo">
                        <figcaption>Jacob Ramirez <br>
                            <span>Operations Manager</span>
                        </figcaption>
                    </figure>
                </div>
                <div class="photo">
                    <figure>
                        <img src="images/ella-villoria.jpg" alt="Ella Villoria's Photo">
                        <figcaption>Ella Villoria<br>
                            <span>Booking Coordinator</span>
                        </figcaption>
                    </figure>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="foot">
            <div class="name">
                <p>©️2025 ❖ The Rapids ❖ Jericho Angolluan</p>
            </div>
            <nav class="socialmedia">
                <a href="https://www.facebook.com/"><img src="images/facebook.png" alt="Facebook Logo"></a>
                <a href="https://www.instagram.com/"><img src="images/instagram.png" alt="Instagram Logo"></a>
                <a href="https://www.whatsapp.com/"><img src="images/whatsapp.png" alt="whatsapp Logo"></a>
            </nav>
        </div>
    </footer>


</body>

</html>
